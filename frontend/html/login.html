<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Grand Haven Hotel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: "#18181b",
                        gold: "#b45309",
                        beige: "#fcfaf8"
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-beige flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo / Hotel Name -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-light tracking-widest text-charcoal uppercase">
                Grand Haven
            </h1>

            <p class="text-xs tracking-[0.3em] text-gray-500 mt-2">
                HOTEL MANAGEMENT SYSTEM
            </p>

        </div>


        <!-- Login Card -->
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">

            <div class="mb-6">

                <h2 class="text-2xl font-semibold text-gray-800">
                    Welcome Back
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    Sign in to your account
                </p>

            </div>


            <!-- Error Message -->
            <div
                id="errorMessage"
                class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"
            ></div>


            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">

                <!-- Email -->
                <div>

                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-2 focus:ring-gold
                        focus:border-gold transition"
                    >

                </div>


                <!-- Password -->
                <div>

                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-2 focus:ring-gold
                        focus:border-gold transition"
                    >

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="w-full py-3 bg-charcoal text-white rounded-lg
                    font-medium hover:bg-gray-800 transition
                    disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Login
                </button>

            </form>


            <!-- Back Home -->
            <div class="text-center mt-6">

                <a
                    href="index.html"
                    class="text-sm text-gray-500 hover:text-gold transition"
                >
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- IMPORTANT: api.js comes BEFORE login.js -->
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>

</body>
</html>
